<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>왕밤빵 위키</title>
  <meta name="description" content="누구나 고쳐 쓰는 마크다운 기반 위키">
  <meta name="theme-color" content="#00a495" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14b8a6" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="왕밤빵 위키">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="assets/style.css?v=10">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wiki-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" id="brand">위키</a>
      <form class="search" id="search-form" role="search" autocomplete="off">
        <input id="search-input" type="search" placeholder="문서 검색" aria-label="문서 검색">
        <button type="submit" aria-label="검색">🔍</button>
        <ul class="suggest" id="suggest" hidden></ul>
      </form>
      <nav class="topnav">
        <a href="#/recent">최근 변경</a>
        <a href="#/random">랜덤</a>
        <a href="#/all">전체 문서</a>
        <button type="button" id="theme-toggle" title="다크 모드 전환" aria-label="다크 모드 전환">🌓</button>
      </nav>
    </div>
  </header>

  <div class="offline-bar" id="offline" role="status" hidden>
    오프라인이에요. 저장돼 있던 내용을 보여 드리는 중이에요. 저장·검색·사진 올리기는 인터넷이 연결된 뒤에 할 수 있어요.
  </div>

  <div class="layout">
    <main id="app" class="main"><p class="loading">불러오는 중…</p></main>
    <aside id="side" class="side" aria-label="최근 변경"></aside>
  </div>

  <footer class="footer" id="footer"></footer>

  <noscript><p style="padding:1rem">이 위키는 JavaScript가 필요합니다.</p></noscript>
  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/vendor/purify.min.js"></script>
  <script src="assets/vendor/turndown.min.js"></script>
  <script src="assets/vendor/turndown-plugin-gfm.js"></script>
  <script src="assets/config.js?v=10"></script>
  <script src="assets/infobox.js?v=10"></script>
  <script src="assets/editor.js?v=10"></script>
  <script src="assets/app.js?v=10"></script>
</body>
</html>
